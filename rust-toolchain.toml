# Latest stable, everywhere. rustup reads this file and uses it for every cargo
# command run inside the repository, so a developer machine and CI compile with
# the same compiler without anybody choosing a version.
#
# "stable" is a moving target by design: it follows each six-week release. That
# is the intent. Pinning an exact version here would freeze the estate on a
# compiler that ages, which is the problem this file exists to avoid.
#
# The components are not optional. CI runs cargo fmt --check and clippy with
# -D warnings, so a toolchain without them fails at the first gate.

[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
