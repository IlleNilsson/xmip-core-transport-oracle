[package]
name = "xmip-core-transport-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-oracle"
description = "Oracle Database transport: one row of a query is one Stream, a send is one INSERT; TNS and the two-task layer's order against a listener, in the Oracle dialect of xmip-core-library-sql. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Its declaration takes what every SQL Location
# declares (`transport::sql`).
transport = { workspace = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
# The estate's encoding primitives: the byte cursor and writer TTC is read and written over.
codec = { workspace = true, optional = true }
# SQL: the Oracle dialect this transport speaks — its literals, its binary
# form, the INSERT a send writes and a far end takes apart, and a
# statement's verb.
sql = { workspace = true, optional = true }
# A packet header read whole, or nothing at a clean close
# (`net::read::header`), and the most a message is read for (`net::MAX_BODY`).
net = { workspace = true, optional = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:codec", "dep:sql", "dep:net"]
# The declaration alone.
declaration = []

# The module's timing program (doc/governance/rust-style.md section 5c): a
# plain cargo test leaves it out, and the landing runs it after every other
# test here, alone, one test at a time, so what it measures is Xmip's work.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
